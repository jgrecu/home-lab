[settings]
lockfile = true

[env]
KUBECONFIG = "{{config_root}}/kubeconfig"
SOPS_CONFIG = "{{config_root}}/.sops.yaml"
SOPS_AGE_KEY_FILE = "{{config_root}}/age.key"
TALOSCONFIG = "{{config_root}}/talos/talosconfig"

[tools]
# Python tooling — uv manages makejinja and pytest via pyproject.toml
"uv" = "0.13.5"

# Task runner
"just" = "1.59.0"

# Git hooks
"lefthook" = "2.2.2"

# Pretty CLI output
"gum" = "2.0.2"

# Text replacement (used by just template tidy)
"sd" = "1.1.0"

# Security scanning
"aqua:gitleaks/gitleaks" = "8.30.1"
"aqua:koalaman/shellcheck" = "0.11.0"
"cargo:zizmor" = "1.31.1"

# Kubernetes tools
"aqua:cilium/cilium-cli" = "0.20.1"
"aqua:fluxcd/flux2" = "2.9.6"
"aqua:helm/helm" = "4.3.1"
"aqua:helmfile/helmfile" = "1.8.2"
"aqua:kubernetes-sigs/kustomize" = "5.8.1"
"aqua:kubernetes/kubernetes/kubectl" = "1.37.1"
"aqua:yannh/kubeconform" = "0.8.0"

# Talos tools — topf replaces talhelper (archived Aug 2026)
"github:postfinance/topf" = "v0.6.1"
"aqua:siderolabs/talos" = "1.14.4"

# Infrastructure tools
"aqua:cloudflare/cloudflared" = "2026.10.3"
"aqua:FiloSottile/age" = "1.3.2"
"aqua:getsops/sops" = "3.13.3"

# CLI utilities
"aqua:cli/cli" = "2.103.0"
"aqua:jqlang/jq" = "1.8.1"
"aqua:mikefarah/yq" = "4.54.1"

# Testing
"aqua:bats-core/bats-core" = "1.14.0"

# Other
"aqua:gruntwork-io/terragrunt" = "latest"

[hooks]
postinstall = "lefthook install"
