#:schema ./cluster.schema.json
# cluster.sample.toml — copy this to cluster.toml and fill in your values
# Run 'just init' to do this automatically.
#
# NEVER commit cluster.toml — it contains secrets encrypted by SOPS
# but the raw values are sensitive. It is gitignored.
#
# Template variables use flat keys (no TOML sections) so that Jinja2 templates
# can reference them directly as #{ variable_name }#.

# ============================================================================
# Network Configuration
# ============================================================================

# The network CIDR for the nodes. (REQUIRED)
# e.g. "192.168.1.0/24"
node_cidr = "192.168.1.0/24"

# DNS servers for the cluster. (OPTIONAL — defaults to Cloudflare 1.1.1.1 / 1.0.0.1)
# node_dns_servers = ["1.1.1.1", "1.0.0.1"]

# NTP servers for the cluster. (OPTIONAL — defaults to Cloudflare NTP)
# node_ntp_servers = ["162.159.200.1", "162.159.200.123"]

# Default gateway for the nodes. (OPTIONAL — defaults to first IP in node_cidr)
# node_default_gateway = ""

# VLAN tag for Talos nodes. (ADVANCED/OPTIONAL)
# node_vlan_tag = ""

# ============================================================================
# Cluster Addresses — all must be unused IPs within node_cidr
# ============================================================================

# IP address for the Kubernetes API server VIP. (REQUIRED)
cluster_api_addr = "192.168.1.55"

# Additional SANs for the Kube API cert. (OPTIONAL)
# cluster_api_tls_sans = ["mycluster.example.com"]

# Pod CIDR — must NOT overlap with node_cidr. (OPTIONAL — default: 10.42.0.0/16)
# cluster_pod_cidr = ""

# Service CIDR — must NOT overlap with node_cidr. (OPTIONAL — default: 10.43.0.0/16)
# cluster_svc_cidr = ""

# Load balancer IP for k8s-gateway (split-DNS for internal services). (REQUIRED)
cluster_dns_gateway_addr = "192.168.1.56"

# Load balancer IP for the internal Envoy gateway. (REQUIRED)
cluster_gateway_addr = "192.168.1.57"

# Load balancer IP for Transmission peer port. (REQUIRED for Transmission)
transmission_peer_addr = "192.168.1.58"

# Load balancer IP for wg-portal WireGuard VPN. (REQUIRED for WireGuard)
wg_portal_vpn_addr = "192.168.1.59"

# wg-portal admin password and WireGuard private key are managed in Vault.
# vault kv put secret-kv2/wg-portal admin-password=... server-private-key=...

# Load balancer IP for Pi-hole DNS server. (REQUIRED for Pi-hole)
pihole_dns_addr = "192.168.1.60"

# Pi-hole admin password is managed in Vault.
# vault kv put secret-kv2/pihole admin-password=...

# Load balancer IP for the external Cloudflare Tunnel gateway. (REQUIRED)
cloudflare_gateway_addr = "192.168.1.61"

# ============================================================================
# Cloudflare Configuration
# ============================================================================

# Your Cloudflare domain. (REQUIRED)
cloudflare_domain = "example.com"

# Cloudflare API token with Zone:DNS:Edit and Account:Cloudflare Tunnel:Read. (REQUIRED)
cloudflare_token = "your-cloudflare-api-token-here"

# ============================================================================
# Cilium CNI Configuration
# ============================================================================

# Load balancer mode for Cilium. (OPTIONAL — default: "dsr")
# Accepted values: "dsr" or "snat"
cilium_loadbalancer_mode = "dsr"

# BGP router IP address. (OPTIONAL — for BGP peering)
# cilium_bgp_router_addr = ""
# cilium_bgp_router_asn  = ""
# cilium_bgp_node_asn    = ""

# ============================================================================
# Repository Configuration
# ============================================================================

# GitHub repository (owner/name). (REQUIRED)
repository_name = "your-github-username/your-repo-name"

# Repository branch. (OPTIONAL — default: "main")
# repository_branch = ""

# Repository visibility. (OPTIONAL — default: "public")
# repository_visibility = ""

# Grafana admin password is managed in Vault.
# vault kv put secret-kv2/grafana admin-user=admin admin-password=...

# ============================================================================
# NFS Storage Configuration
# ============================================================================

# IP address of your NFS server / NAS. (REQUIRED if using NFS storage)
nfs_server_addr = "192.168.1.100"

# NFS export paths. (REQUIRED for respective apps)
nfs_server_path   = "/nfs"
nfs_media_path    = "/videos"
nfs_photos_path   = "/immich"
nfs_books_path    = "/books"
nfs_seaweedfs_path = "/seaweedfs"
nfs_nextcloud_path = "/nextcloud"

# Nextcloud admin password is managed in Vault.
# vault kv put secret-kv2/nextcloud admin-password=...

# ============================================================================
# Forgejo Configuration
# ============================================================================

# Forgejo admin account. (REQUIRED — used in Helm values, not a secret)
forgejo_admin_email    = "admin@example.com"

# Forgejo admin password, runner secret, and runner UUID are managed in Vault.
# vault kv put secret-kv2/forgejo username=forgejo-admin password=... admin-password=...
# vault kv put secret-kv2/forgejo-runner token=... uuid=...

# ============================================================================
# Linkding Configuration
# ============================================================================

# Linkding admin password and healthcheck token are managed in Vault.
# vault kv put secret-kv2/linkding admin-password=... healthcheck-token=...

# ============================================================================
# Woodpecker CI Configuration
# ============================================================================

# Must match the Forgejo admin username. (REQUIRED — used in Helm values, not a secret)
woodpecker_admin_user = "admin"

# Woodpecker OAuth credentials and agent secret are managed in Vault.
# vault kv put secret-kv2/woodpecker gitea-client-id=... gitea-client-secret=... agent-secret=...
# vault kv put secret-kv2/woodpecker-agent agent-secret=...

# ============================================================================
# Media Stack Configuration (Radarr / Sonarr / Prowlarr / Bazarr / SABnzbd)
# ============================================================================

# SABnzbd API key — app-managed (written into sabnzbd.ini on first boot, not a K8s Secret).
sabnzbd_api_key         = ""

# All other media stack API keys are managed in Vault (obtain from each app after first deploy):
# vault kv put secret-kv2/radarr    api-key=...
# vault kv put secret-kv2/sonarr    api-key=...
# vault kv put secret-kv2/prowlarr  api-key=...
# vault kv put secret-kv2/bazarr    api-key=...
# vault kv put secret-kv2/recyclarr radarr-api-key=... sonarr-api-key=...
# vault kv put secret-kv2/lingarr   radarr-api-key=... sonarr-api-key=...

# ============================================================================
# Grimmory Configuration
# ============================================================================

# Grimmory MariaDB passwords are managed in Vault.
# vault kv put secret-kv2/grimmory mariadb-root-password=... mariadb-password=...

# ============================================================================
# Health Auto Export Configuration
# ============================================================================

# Health Auto Export secrets are managed in Vault.
# vault kv put secret-kv2/health-auto-export mongo-username=admin mongo-password=... read-token=... write-token=...
# vault kv put secret-kv2/health-auto-export-mongodb username=admin password=...

# ============================================================================
# Immich
# ============================================================================

# Immich exporter API key is managed in Vault.
# vault kv put secret-kv2/immich-exporter token=...

# ============================================================================
# Volsync Backup Configuration
# ============================================================================

# Restic encryption password. Generate: openssl rand -base64 32
volsync_restic_password = ""

# S3 credentials for SeaweedFS — auto-populated by: just ops bootstrap-seaweedfs
volsync_s3_access_key = ""
volsync_s3_secret_key = ""

# ============================================================================
# SeaweedFS S3 Configuration
# ============================================================================

# Populated automatically by: just ops bootstrap-seaweedfs
seaweedfs_s3_access_key_id     = ""
seaweedfs_s3_secret_access_key = ""

# ============================================================================
# Cloudflare R2 Offsite Backup
# ============================================================================

r2_access_key_id  = ""
r2_secret_access_key = ""
r2_endpoint       = ""
r2_bucket         = ""

# ============================================================================
# Vault Configuration
# ============================================================================

# AWS KMS auto-unseal. Populate from the OpenTofu module:
#   just ops tofu-kms output                       # key id, access key id
#   just ops tofu-kms output -raw secret_access_key
#
# First deploy only (auto-unseal handles every restart afterwards):
#   kubectl -n vault exec -it vault-0 -- vault operator init
# The root token and recovery keys are printed once — store them securely.
vault_kms_aws_region        = "eu-south-2"
vault_kms_key_id            = ""
vault_kms_access_key_id     = ""
vault_kms_secret_access_key = ""

# ============================================================================
# Nodes — one [[nodes]] block per cluster node
# ============================================================================
#
# Required fields per node:
#   name          — hostname, must match [a-z0-9-]+
#   address       — static IP within node_cidr
#   controller    — true for control-plane nodes
#   disk          — device path (talosctl get disks -n <ip> --insecure)
#   mac_addr      — primary NIC MAC (talosctl get links -n <ip> --insecure)
#   schematic_id  — from https://factory.talos.dev/
#
# Optional fields:
#   mtu           — MTU for the NIC (default: 1500)
#   secureboot    — SecureBoot on UEFI (default: false)
#   encrypt_disk  — TPM-based FDE (default: false)
#   kernel_modules — e.g. ["nvidia", "nvidia_uvm"] for GPU nodes
#   media_node    — label node for download apps (default: false)

[[nodes]]
name         = "node-ctrl-01"
address      = "192.168.1.50"
controller   = true
disk         = "/dev/sda"
mac_addr     = "00:00:00:00:00:00"
schematic_id = "your-schematic-id-from-factory-talos-dev"

[[nodes]]
name         = "node-worker-01"
address      = "192.168.1.51"
controller   = false
disk         = "/dev/sda"
mac_addr     = "00:00:00:00:00:01"
schematic_id = "your-schematic-id-from-factory-talos-dev"
media_node   = true

[[nodes]]
name         = "node-worker-02"
address      = "192.168.1.52"
controller   = false
disk         = "/dev/sda"
mac_addr     = "00:00:00:00:00:02"
schematic_id = "your-schematic-id-from-factory-talos-dev"
