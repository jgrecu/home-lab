cluster:
  allowSchedulingOnControlPlanes: true
  network:
    podSubnets:
      - "10.42.0.0/16"
    serviceSubnets:
      - "10.43.0.0/16"
    cni:
      name: none
  coreDNS:
    disabled: true
  etcd:
    extraArgs:
      listen-metrics-urls: http://0.0.0.0:2381
    advertisedSubnets:
      - 192.168.1.0/24
  apiServer:
    certSANs:
      - "127.0.0.1"
      - "192.168.1.55"
---
apiVersion: v1alpha1
kind: KubeAPIServerConfig
extraArgs:
  enable-aggregator-routing: "true"
---
apiVersion: v1alpha1
kind: KubeControllerManagerConfig
extraArgs:
  bind-address: "0.0.0.0"
---
apiVersion: v1alpha1
kind: KubeSchedulerConfig
extraArgs:
  bind-address: "0.0.0.0"
---
apiVersion: v1alpha1
kind: KubeProxyConfig
enabled: false
