---
# Base SnapshotSchedule. Apps patch: metadata.name, spec.policyRef.name,
# spec.schedule.cron.
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: kopiur-app
  namespace: placeholder
spec:
  policyRef:
    name: kopiur-app
  schedule:
    cron: "0 2 * * *"
    jitter: 30m
    runOnCreate: false
    concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
