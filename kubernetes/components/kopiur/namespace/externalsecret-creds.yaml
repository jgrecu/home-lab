---
# ExternalSecret: SeaweedFS credentials + Kopia repository password.
# Secret name must match Repository.spec.backend.s3.auth.secretRef.name
# and Repository.spec.encryption.passwordSecretRef.name.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kopiur-seaweedfs-creds
  namespace: placeholder
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: kopiur-seaweedfs-creds
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: kopiur/seaweedfs # gitleaks:allow
        property: AWS_ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: kopiur/seaweedfs # gitleaks:allow
        property: AWS_SECRET_ACCESS_KEY
    - secretKey: KOPIA_PASSWORD
      remoteRef:
        key: kopiur/seaweedfs # gitleaks:allow
        property: KOPIA_PASSWORD
