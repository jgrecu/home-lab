---
# ExternalSecret: Cloudflare R2 destination credentials for RepositoryReplication.
# NO KOPIA_PASSWORD — RepositoryReplication is a blob-level copy
# that inherits the source repository's encryption automatically.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kopiur-r2-dest-creds
  namespace: placeholder
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: kopiur-r2-dest-creds
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: kopiur/r2
        property: AWS_ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: kopiur/r2
        property: AWS_SECRET_ACCESS_KEY
    - secretKey: AWS_DEFAULT_REGION
      remoteRef:
        key: kopiur/r2
        property: AWS_DEFAULT_REGION
