---
# RepositoryReplication mirrors SeaweedFS repo to Cloudflare R2 (3-2-1).
# Runs nightly after backups complete.
apiVersion: kopiur.home-operations.com/v1alpha1
kind: RepositoryReplication
metadata:
  name: kopiur-r2-replication
  namespace: placeholder
spec:
  sourceRef:
    kind: Repository
    name: kopiur-primary
  destination:
    s3:
      bucket: homelab-volsync
      prefix: placeholder/
      endpoint: b27b804460d838473e1d76de2194d12f.eu.r2.cloudflarestorage.com
      region: auto
      auth:
        secretRef:
          name: kopiur-r2-dest-creds
  schedule:
    cron: "0 5 * * *"
    jitter: 1h
  sync:
    parallel: 8
    deleteExtra: true
  suspend: false
