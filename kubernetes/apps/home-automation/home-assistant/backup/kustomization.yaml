---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: home-automation
components:
  - ../../../../components/kopiur/app
patches:
  - target:
      kind: SnapshotPolicy
      name: kopiur-app
    patch: |
      - op: replace
        path: /metadata/name
        value: home-assistant
      - op: replace
        path: /spec/sources/0/pvc/name
        value: home-assistant
      - op: replace
        path: /spec/mover/resources/requests/memory
        value: 256Mi
      - op: replace
        path: /spec/mover/resources/limits/memory
        value: 512Mi
      - op: add
        path: /spec/mover/securityContext
        value:
          runAsUser: 0
          runAsNonRoot: false
  - target:
      kind: SnapshotSchedule
      name: kopiur-app
    patch: |
      - op: replace
        path: /metadata/name
        value: home-assistant
      - op: replace
        path: /spec/policyRef/name
        value: home-assistant
      - op: replace
        path: /spec/schedule/cron
        value: "0 2 * * *"
