---
# immich-exporter: reads the Immich API and exposes 100+ library metrics for Prometheus.
# Feeds the Immich Library Grafana dashboard (grafana.com/dashboards/26030).
# Source: https://github.com/moond4rk/immich-exporter
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-exporter
  namespace: entertainment
  labels:
    app: immich-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: immich-exporter
  template:
    metadata:
      labels:
        app: immich-exporter
      annotations:
        secret.reloader.stakater.com/reload: immich-exporter
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: immich-exporter
          image: ghcr.io/moond4rk/immich-exporter:1.4.0 # datasource=docker depName=ghcr.io/moond4rk/immich-exporter
          env:
            - name: IMMICH_BASE_URL
              value: "http://immich-server.entertainment.svc.cluster.local:2283/api"
            - name: IMMICH_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: immich-exporter
                  key: token
            - name: SCRAPE_INTERVAL
              value: 2m
            - name: BREAKDOWN_INTERVAL
              value: 15m
          ports:
            - name: metrics
              containerPort: 8000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: immich-exporter
  namespace: entertainment
  labels:
    app: immich-exporter
spec:
  selector:
    app: immich-exporter
  ports:
    - name: metrics
      port: 8000
      targetPort: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: immich-exporter
  namespace: entertainment
  labels:
    app: immich-exporter
spec:
  selector:
    matchLabels:
      app: immich-exporter
  endpoints:
    - port: metrics
      path: /metrics
      interval: 60s
      scrapeTimeout: 30s
