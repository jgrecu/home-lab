apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: immich
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Entertainment
    gethomepage.dev/name: Immich
    gethomepage.dev/icon: immich.png
    gethomepage.dev/description: Photo and video management
    gethomepage.dev/href: https://immich.jgrecu.dev
    gethomepage.dev/pod-selector: app.kubernetes.io/name=server
spec:
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  hostnames:
    - immich.jgrecu.dev
  rules:
    - backendRefs:
        - name: immich-server
          port: 2283
