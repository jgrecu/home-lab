---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: immich-exporter
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: immich-exporter
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: immich-exporter
        property: token
