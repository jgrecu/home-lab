---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grimmory
spec:
  chartRef:
    kind: OCIRepository
    name: grimmory
  interval: 1h
  values:
    image:
      repository: ghcr.io/grimmory-tools/grimmory
      tag: v3.3.3

    # Bundled MariaDB subchart
    mariadb:
      enabled: true
      image:
        tag: 12.2.2
      auth:
        database: grimmory
        username: grimmory
        existingSecret: grimmory-mariadb-secret
        secretKeys:
          rootPasswordKey: mariadb-root-password
          userPasswordKey: mariadb-password
      service:
        port: 3306

    extraEnv:
      - name: USER_ID
        value: "1000"
      - name: GROUP_ID
        value: "1000"
      - name: TZ
        value: "Europe/Madrid"
      - name: DISK_TYPE
        value: "NETWORK"

    service:
      type: ClusterIP
      port: 6060

    ingress:
      enabled: false

    persistence:
      dataVolume:
        enabled: true
        size: 500Mi
        storageClass: longhorn
      booksVolume:
        enabled: true
        existingClaim: grimmory-books

    resources:
      requests:
        cpu: 25m
        memory: 550Mi
      limits:
        memory: 1Gi

  # grimmory-data is RWO — only one node can hold the volume at a time.
  # Recreate terminates the old pod before the new one starts, preventing
  # multi-attach failures when the scheduler picks a different node.
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: grimmory
            patch: |
              - op: add
                path: /spec/strategy
                value:
                  type: Recreate
