---
# Helm values for app-template (kavita).
controllers:
  kavita:
    strategy: Recreate
    containers:
      app:
        image:
          repository: ghcr.io/kareadita/kavita
              # renovate: datasource=docker depName=ghcr.io/kareadita/kavita
          tag: 0.9.1
        env:
          TZ: "Europe/Madrid"
          KAVITA__OpenIdConnectSettings__Enabled: "true"
          KAVITA__OpenIdConnectSettings__Authority: "https://id.jgrecu.dev"
          KAVITA__OpenIdConnectSettings__ClientId: "978f5405-8156-484d-91a9-bcea851aa60c"
          KAVITA__OpenIdConnectSettings__Secret:
            valueFrom:
              secretKeyRef:
                name: kavita-secret
                key: oidc-client-secret
        probes:
          liveness: &probes
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: &port 5000
              initialDelaySeconds: 30
              periodSeconds: 30
              timeoutSeconds: 10
              failureThreshold: 10
          readiness: *probes
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: ["ALL"]}
        resources:
          requests:
            cpu: 25m
            memory: 512Mi
          limits:
            memory: 1Gi
persistence:
      # Kavita config + SQLite database — kept locally on Longhorn
  config:
    type: persistentVolumeClaim
    storageClass: longhorn
    size: 2Gi
    accessMode: ReadWriteOnce
    globalMounts:
      - path: /kavita/config
      # Book library on NFS — manga, comics, PDFs, ebooks
      # Uses static PV pointing directly to /books on NAS
  books:
    type: persistentVolumeClaim
    existingClaim: kavita-books
    globalMounts:
      - path: /books
service:
  app:
    ports:
      http:
        port: *port
route:
  app:
    parentRefs:
      - name: envoy-external
        namespace: network
        sectionName: https
    rules:
      - backendRefs:
          - identifier: app
            port: *port
    annotations:
      gethomepage.dev/enabled: "true"
      gethomepage.dev/group: Entertainment
      gethomepage.dev/name: Kavita
      gethomepage.dev/icon: kavita.png
      gethomepage.dev/description: Ebook and manga reader
