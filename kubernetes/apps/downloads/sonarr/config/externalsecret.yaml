---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sonarr-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: sonarr-secret
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: sonarr
        property: api-key
