---
# CloudNativePG manages this PostgreSQL instance.
# The operator automatically creates a secret named "lingarr-postgres-app"
# in this namespace containing: username, password, host, port, dbname, uri.
# Lingarr's HelmRelease reads the password directly from that secret.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: lingarr-postgres
spec:
  # 2 instances = 1 primary + 1 replica for high availability.
  # CNPG operator automatically enables soft pod anti-affinity to spread across nodes.
  instances: 2
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi
  storage:
    storageClass: longhorn-single
    size: 10Gi
  bootstrap:
    initdb:
      database: lingarr
      owner: lingarr
  # Continuous WAL archiving to SeaweedFS S3
  # Provides point-in-time recovery with ~5 minute RPO
  backup:
    barmanObjectStore:
      serverName: lingarr-postgres
      destinationPath: "s3://cnpg-backups/lingarr-postgres/"
      endpointURL: "http://seaweedfs-filer.storage.svc.cluster.local:8333"
      s3Credentials:
        accessKeyId:
          name: cnpg-backup-secret
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: cnpg-backup-secret
          key: ACCESS_SECRET_KEY
        region:
          name: cnpg-backup-secret
          key: AWS_REGION
      wal:
        compression: gzip
        maxParallel: 2
    retentionPolicy: "180d"
