---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: downloads
components:
  - ../../../../components/kopiur/app
patches:
  - target:
      kind: SnapshotPolicy
      name: kopiur-app
    patch: |
      - op: replace
        path: /metadata/name
        value: recyclarr
      - op: replace
        path: /spec/sources/0/pvc/name
        value: recyclarr
  - target:
      kind: SnapshotSchedule
      name: kopiur-app
    patch: |
      - op: replace
        path: /metadata/name
        value: recyclarr
      - op: replace
        path: /spec/policyRef/name
        value: recyclarr
      - op: replace
        path: /spec/schedule/cron
        value: "0 5 * * *"
