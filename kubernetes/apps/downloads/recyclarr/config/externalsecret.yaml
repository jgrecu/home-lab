---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: recyclarr-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: recyclarr-secret
    creationPolicy: Owner
  data:
    - secretKey: radarr-api-key
      remoteRef:
        key: recyclarr
        property: radarr-api-key
    - secretKey: sonarr-api-key
      remoteRef:
        key: recyclarr
        property: sonarr-api-key
