---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: downloads
components:
  - ../../../components/kopiur/namespace
patches:
  - target:
      kind: Repository
      name: kopiur-primary
    patch: |
      - op: replace
        path: /spec/backend/s3/prefix
        value: downloads/
  - target:
      kind: RepositoryReplication
      name: kopiur-r2-replication
    patch: |
      - op: replace
        path: /spec/destination/s3/prefix
        value: downloads/
