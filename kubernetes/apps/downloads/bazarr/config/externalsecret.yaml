---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: bazarr-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: bazarr-secret
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: bazarr
        property: api-key
