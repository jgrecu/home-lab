---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: radarr-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: radarr-secret
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: radarr
        property: api-key
