---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
  - ../../../../components/volsync
patches:
  - target:
      kind: ReplicationSource
      name: volsync-local
    patch: |
      - op: replace
        path: /metadata/name
        value: radarr-config-backup
      - op: replace
        path: /metadata/namespace
        value: downloads
      - op: replace
        path: /spec/sourcePVC
        value: radarr
      - op: replace
        path: /spec/trigger/schedule
        value: "0 4 * * *"
      - op: replace
        path: /spec/restic/repository
        value: radarr-config-restic-secret
      - op: replace
        path: /spec/restic/moverResources/limits/memory
        value: 512Mi
      - op: replace
        path: /spec/restic/moverResources/requests/memory
        value: 256Mi
  - target:
      kind: ReplicationSource
      name: volsync-r2
    patch: |
      - op: replace
        path: /metadata/name
        value: radarr-config-backup-r2
      - op: replace
        path: /metadata/namespace
        value: downloads
      - op: replace
        path: /spec/sourcePVC
        value: radarr
      - op: replace
        path: /spec/restic/repository
        value: radarr-config-r2-restic-secret
resources:
  - ./externalsecret.yaml
  - ./externalsecret-r2.yaml
