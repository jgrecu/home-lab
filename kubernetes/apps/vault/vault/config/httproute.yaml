apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vault
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Infrastructure
    gethomepage.dev/name: Vault
    gethomepage.dev/icon: vault.png
    gethomepage.dev/description: HashiCorp Vault secret management
    gethomepage.dev/href: https://vault.jgrecu.dev
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - vault.jgrecu.dev
  rules:
    # Vault 2.2.x bug: GET /ui/ without Accept-Encoding returns 200 with an empty body
    # (2.1.2 is fine). Always ask Vault for gzip; remove once a fixed release is out.
    - filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: Accept-Encoding
                value: gzip
      backendRefs:
        - name: vault-ui
          port: 8200
