---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vault
spec:
  interval: 1h
  chart:
    spec:
      chart: vault
      version: 0.34.1
      sourceRef:
        kind: HelmRepository
        name: hashicorp
      interval: 1h
  values:
    global:
      # PSP removed in K8s 1.25+ — Talos runs 1.37.x
      psp:
        enable: false

    injector:
      # Disable the mutating webhook agent injector — not needed for playground
      enabled: false

    server:
      image:
        repository: hashicorp/vault
        # Pinned to match work environment
        tag: "2.2.1"
        pullPolicy: IfNotPresent

      # HA mode with integrated Raft storage (single replica: 1–2 node cluster).
      # Raft makes `vault operator raft snapshot` backups possible.
      standalone:
        enabled: false
      ha:
        enabled: true
        replicas: 1
        # chart computes maxUnavailable=0 for 1 replica, which blocks node drains
        disruptionBudget:
          enabled: false
        raft:
          enabled: true
          setNodeId: true
          config: |
            ui = true

            listener "tcp" {
              tls_disable = 1
              address     = "[::]:8200"
              cluster_address = "[::]:8201"
            }

            storage "raft" {
              path = "/vault/data/raft"
            }

            # AWS KMS auto-unseal (eu-south-2). Region, key id and credentials
            # come from the vault-kms Secret via extraSecretEnvironmentVars.
            seal "awskms" {}

            service_registration "kubernetes" {}

      # AWS KMS seal credentials (ops/terraform/aws-kms -> just ops vault-kms-secret)
      extraSecretEnvironmentVars:
        - envName: AWS_REGION
          secretName: vault-kms
          secretKey: AWS_REGION
        - envName: VAULT_AWSKMS_SEAL_KEY_ID
          secretName: vault-kms
          secretKey: VAULT_AWSKMS_SEAL_KEY_ID
        - envName: AWS_ACCESS_KEY_ID
          secretName: vault-kms
          secretKey: AWS_ACCESS_KEY_ID
        - envName: AWS_SECRET_ACCESS_KEY
          secretName: vault-kms
          secretKey: AWS_SECRET_ACCESS_KEY

      # Clear default pod anti-affinity — blocks scheduling on a single-node-available cluster
      affinity: ""

      # OnDelete: safer for Vault — prevents auto-restart after upgrades,
      # giving you control over when to restart and re-unseal
      updateStrategyType: "OnDelete"

      # Persistent storage for Vault data (file backend)
      dataStorage:
        enabled: true
        size: 2Gi
        storageClass: longhorn
        accessMode: ReadWriteOnce

      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 512Mi

      # Readiness: Vault is ready only when unsealed (sealed -> 503 -> NotReady,
      # which fires the VaultSealed alert)
      readinessProbe:
        enabled: true
        path: "/v1/sys/health?standbyok=true&uninitcode=204"

      # Liveness: keep pod alive even when sealed (so you can unseal it)
      livenessProbe:
        enabled: true
        path: "/v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204"
        initialDelaySeconds: 60

    ui:
      # Creates a dedicated ClusterIP Service for the UI on port 8200
      enabled: true
      serviceType: ClusterIP
