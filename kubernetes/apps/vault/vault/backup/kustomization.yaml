---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: vault
components:
  - ../../../../components/kopiur/app
patches:
  - target:
      kind: SnapshotPolicy
      name: kopiur-app
    patch: |
      - op: replace
        path: /metadata/name
        value: vault
      - op: replace
        path: /spec/sources/0/pvc/name
        value: data-vault-0
  - target:
      kind: SnapshotSchedule
      name: kopiur-app
    patch: |
      - op: replace
        path: /metadata/name
        value: vault
      - op: replace
        path: /spec/policyRef/name
        value: vault
      - op: replace
        path: /spec/schedule/cron
        value: "0 3 * * *"
