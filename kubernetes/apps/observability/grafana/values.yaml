---
# Helm values for grafana (grafana).
admin:
  existingSecret: grafana-secret
  userKey: admin-user
  passwordKey: admin-password

envFromSecret: grafana-secret

# Public URL behind envoy-internal; Grafana derives OAuth redirect_uri from this.
# Without it, it defaults to http://<domain>:3000/ which won't match the IdP client.
grafana.ini:
  server:
    root_url: https://grafana.jgrecu.dev
  # Link OIDC logins to existing local users by email (e.g. the admin account).
  # Safe here: Pocket ID is self-hosted and users cannot claim arbitrary emails.
  auth:
    oauth_allow_insecure_email_lookup: true
  # Pocket ID OIDC. Client ID/secret come from grafana-secret via envFromSecret
  # (GF_AUTH_GENERIC_OAUTH_CLIENT_ID / GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET).
  auth.generic_oauth:
    enabled: true
    name: Pocket ID
    icon: signin
    allow_sign_up: true
    use_pkce: true
    scopes: openid profile email groups
    auth_url: https://id.jgrecu.dev/authorize
    token_url: https://id.jgrecu.dev/api/oidc/token
    api_url: https://id.jgrecu.dev/api/oidc/userinfo
    login_attribute_path: preferred_username
    email_attribute_path: email
    name_attribute_path: name
    groups_attribute_path: groups
    role_attribute_path: contains(groups[*], 'admins') && 'Admin' || 'Viewer'

plugins:
  - yesoreyeram-infinity-datasource

    # Pre-configure Prometheus and Loki as data sources so dashboards
    # work out of the box without any manual UI configuration.
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090
        isDefault: true
        jsonData:
          timeInterval: 1m
      - name: Loki
        type: loki
        url: http://loki-gateway.observability.svc.cluster.local:80
        jsonData:
          maxLines: 1000
      - name: Health Auto Export
        type: yesoreyeram-infinity-datasource
        uid: cfw5j5z3kzwn4d
        url: http://health-auto-export.health.svc.cluster.local:3001
        jsonData:
          tlsSkipVerify: true
          httpHeaderName1: api-key
        secureJsonData:
          httpHeaderValue1: $__env{HAE_READ_TOKEN}

    # Enable sidecar to watch for ConfigMaps with grafana_dashboard label
    # This adds custom dashboards from ConfigMaps to the existing downloaded ones
sidecar:
  dashboards:
    enabled: true
    label: grafana_dashboard
    labelValue: "1"
    searchNamespace: ALL
    folderAnnotation: grafana_folder
    folder: /tmp/dashboards
    provider:
      disableDelete: false
      allowUiUpdates: true
      foldersFromFilesStructure: true
  datasources:
    enabled: false

    # Dashboard provider configuration
    # Note: The sidecar container automatically creates "sidecarProvider" for /tmp/dashboards,
    # so we only need to define the "default" provider here to avoid duplicates.
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: ""
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default

    # All dashboards are now managed via ConfigMaps (see dashboard-*.yaml files)
    # This ensures version control, reproducibility, and consistency with GitOps
dashboards:
  default: {}

persistence:
  enabled: true
  storageClassName: longhorn
  size: 1Gi

    # Recreate strategy required: RWO PVC cannot be attached to multiple pods
deploymentStrategy:
  type: Recreate

podAnnotations:
  secret.reloader.stakater.com/reload: &app grafana

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false

route:
  main:
    enabled: true
    parentRefs:
      - name: envoy-internal
        namespace: network
        sectionName: https

resources:
  requests:
    cpu: 25m
    memory: 192Mi
  limits:
    memory: 512Mi

# --- merged from values.sops.yaml ---
# Helm values with the domain (fully encrypted) for grafana (grafana).
route:
  main:
    annotations:
      gethomepage.dev/enabled: "true"
      gethomepage.dev/group: Observability
      gethomepage.dev/name: Grafana
      gethomepage.dev/icon: grafana.png
      gethomepage.dev/description: Metrics visualization platform
      gethomepage.dev/href: https://grafana.jgrecu.dev
    hostnames:
      - grafana.jgrecu.dev
