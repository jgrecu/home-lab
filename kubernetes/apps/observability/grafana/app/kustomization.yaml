  # Infrastructure dashboards
  - ./dashboard-cert-manager.yaml
  - ./dashboard-cilium-agent.yaml
  - ./dashboard-cilium-operator.yaml
  - ./dashboard-flux-cluster.yaml
  - ./dashboard-flux-control-plane.yaml
  - ./dashboard-kubernetes-api-server.yaml
  - ./dashboard-kubernetes-cluster.yaml
