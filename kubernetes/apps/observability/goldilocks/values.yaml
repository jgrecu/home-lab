---
# Helm values for goldilocks (goldilocks).
    # Goldilocks dashboard for viewing VPA recommendations
dashboard:
  enabled: true
  replicaCount: 1
  resources:
    requests:
      cpu: 15m
      memory: 100Mi
    limits:
      memory: 256Mi
  service:
    type: ClusterIP
    port: 80

    # Controller that creates VPA objects automatically
controller:
  enabled: true
  resources:
    requests:
      cpu: 15m
      memory: 100Mi
    limits:
      memory: 256Mi

    # Enable metrics for Prometheus
metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s

