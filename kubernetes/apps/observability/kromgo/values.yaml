---
# Helm values for app-template (kromgo).
controllers:
  kromgo:
    strategy: RollingUpdate
    containers:
      app:
        image:
          repository: ghcr.io/kashalls/kromgo
          tag: v0.10.0
        env:
          # Prometheus endpoint to query metrics from
          PROMETHEUS_URL: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090
          PORT: &port 8080
          HEALTH_PORT: &healthPort 8888
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /readyz
                port: *healthPort
              initialDelaySeconds: 10
              periodSeconds: 30
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /readyz
                port: *healthPort
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          readOnlyRootFilesystem: true
        resources:
          requests:
            cpu: 15m
            memory: 100Mi
          limits:
            memory: 256Mi
configMaps:
  config:
    data:
      config.yaml: |
        # Kromgo exposes individual Prometheus metrics as plain-text HTTP
        # endpoints — designed for embedding badges in a GitHub README.
        #
        # Example badge URL: https://img.shields.io/endpoint?url=https://kromgo.jgrecu.dev/cluster_node_count
        # Full docs: https://github.com/kashalls/kromgo

        metrics:
          - name: talos_version
            query: node_os_info{id="talos"}
            label: "Talos"
            label_name: version_id
            colors:
              - { color: "blue", min: 0, max: 1 }

          - name: kubernetes_version
            query: kubernetes_build_info{job="apiserver"}
            label: "Kubernetes"
            label_name: git_version
            colors:
              - { color: "blue", min: 0, max: 1 }

          - name: argocd_version
            query: argocd_info{container="server"}
            label: "Argo CD"
            label_name: version
            colors:
              - { color: "orange", min: 0, max: 1 }

          - name: cluster_node_count
            query: count(kube_node_info)
            label: "Nodes"
            suffix: " nodes"
            colors:
              - { color: "green", min: 3, max: 3 }
              - { color: "orange", min: 1, max: 2 }

          - name: cluster_cpu_usage
            query: round(avg(100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)), 0.1)
            label: "CPU"
            suffix: "%"
            colors:
              - { color: "green", min: 0, max: 50 }
              - { color: "orange", min: 51, max: 75 }
              - { color: "red", min: 76, max: 100 }

          - name: cluster_memory_usage
            query: round(sum(node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / sum(node_memory_MemTotal_bytes) * 100, 0.1)
            label: "Memory"
            suffix: "%"
            colors:
              - { color: "green", min: 0, max: 50 }
              - { color: "orange", min: 51, max: 75 }
              - { color: "red", min: 76, max: 100 }

          - name: cluster_pods_count
            query: sum(kube_pod_status_phase{phase="Running"})
            label: "Pods"
            suffix: " pods"
            colors:
              - { color: "green", min: 1, max: 9999 }
persistence:
  config:
    type: configMap
    identifier: config
    globalMounts:
      - path: /kromgo/config.yaml
        subPath: config.yaml
        readOnly: true
service:
  app:
    ports:
      http:
        port: *port
      health:
        port: *healthPort
route:
  app:
    parentRefs:
      - name: envoy-external
        namespace: network
        sectionName: https
    rules:
      - backendRefs:
          - identifier: app
            port: *port
    hostnames:
      - kromgo.jgrecu.dev
