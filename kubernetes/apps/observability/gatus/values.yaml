---
# Helm values for app-template (gatus).
controllers:
  gatus:
        # Recreate strategy required: RWO PVC cannot be attached to multiple pods
    strategy: Recreate
    containers:
      app:
        image:
          repository: ghcr.io/twin/gatus
          tag: v5.38.0
        env:
              # Tell Gatus where its config file lives
          GATUS_CONFIG_PATH: /config/config.yaml
        probes:
          liveness: &probes
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: &port 8080
              initialDelaySeconds: 10
              periodSeconds: 30
          readiness: *probes
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: ["ALL"]}
          readOnlyRootFilesystem: true
        resources:
          requests:
            cpu: 15m
            memory: 100Mi
          limits:
            memory: 256Mi

persistence:
      # Config file from the ConfigMap defined above
  config:
    type: configMap
    identifier: config
    globalMounts:
      - path: /config
        readOnly: true
      # SQLite database for storing uptime history
  data:
    type: persistentVolumeClaim
    storageClass: longhorn
    size: 1Gi
    accessMode: ReadWriteOnce
    globalMounts:
      - path: /data

service:
  app:
    ports:
      http:
        port: *port

route:
  app:
    annotations:
      gethomepage.dev/enabled: "true"
      gethomepage.dev/name: "Gatus"
      gethomepage.dev/group: "Observability"
      gethomepage.dev/description: "Status page and uptime monitoring"
      gethomepage.dev/icon: "gatus.png"
    parentRefs:
      - name: envoy-internal
        namespace: network
        sectionName: https
    rules:
      - backendRefs:
          - identifier: app
            port: *port
