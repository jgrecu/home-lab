---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pocket-id-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: pocket-id
    creationPolicy: Owner
    template:
      data:
        # Chart mounts this secret as envFrom; keys become env vars directly
        ENCRYPTION_KEY: "{{ .encryptionKey }}"
        STATIC_API_KEY: "{{ .staticApiKey }}"
        # Non-sensitive — injected here so chart needs no secret.create
        DB_CONNECTION_STRING: "file:data/pocket-id.db"
  data:
    - secretKey: encryptionKey
      remoteRef:
        key: pocket-id
        property: encryption-key
    - secretKey: staticApiKey
      remoteRef:
        key: pocket-id
        property: static-api-key
