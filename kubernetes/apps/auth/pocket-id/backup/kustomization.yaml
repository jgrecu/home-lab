---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
  - ../../../../components/volsync
patches:
  - target:
      kind: ReplicationSource
      name: volsync-local
    patch: |
      - op: replace
        path: /metadata/name
        value: pocket-id-data-backup
      - op: replace
        path: /metadata/namespace
        value: auth
      - op: replace
        path: /spec/sourcePVC
        value: pocket-id-data-pocket-id-0
      - op: replace
        path: /spec/trigger/schedule
        value: "0 4 * * *"
      - op: replace
        path: /spec/restic/repository
        value: pocket-id-data-restic-secret
      - op: replace
        path: /spec/restic/capacity
        value: 1Gi
  - target:
      kind: ReplicationSource
      name: volsync-r2
    patch: |
      - op: replace
        path: /metadata/name
        value: pocket-id-data-backup-r2
      - op: replace
        path: /metadata/namespace
        value: auth
      - op: replace
        path: /spec/sourcePVC
        value: pocket-id-data-pocket-id-0
      - op: replace
        path: /spec/restic/repository
        value: pocket-id-data-r2-restic-secret
      - op: replace
        path: /spec/restic/capacity
        value: 1Gi
resources:
  - ./externalsecret.yaml
  - ./externalsecret-r2.yaml
