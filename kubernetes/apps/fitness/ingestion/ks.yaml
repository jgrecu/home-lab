---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: fitness-ingestion
spec:
  interval: 1h
  path: ./kubernetes/apps/fitness/ingestion/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: fitness
  wait: false
  dependsOn:
    - name: influxdb
