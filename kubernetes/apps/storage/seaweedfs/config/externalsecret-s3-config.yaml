---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: seaweedfs-s3-secret
  namespace: storage
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: seaweedfs-s3-secret
    creationPolicy: Owner
  data:
    - secretKey: seaweedfs_s3_config
      remoteRef:
        key: seaweedfs
        property: s3-config
