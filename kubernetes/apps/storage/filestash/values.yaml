---
# Helm values for app-template (filestash).
# Filestash is a modern web file manager with S3 backend support.
# No versioned releases — pinned by digest. Check machines/filestash:latest
# for updates.
controllers:
  filestash:
    strategy: RollingUpdate
    pod:
      annotations:
        secret.reloader.stakater.com/reload: filestash-secret
    containers:
      app:
        image:
          repository: machines/filestash
          # renovate: datasource=docker depName=docker.io/machines/filestash
          tag: "latest@sha256:688ed36f0640efc36e16c7680bfbc21c5e8431c00f702f24f991df2353d225e8"
        env:
          APPLICATION_URL: "https://filestash.jgrecu.dev"
        probes:
          liveness: &probes
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: &port 8334
              initialDelaySeconds: 15
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 3
          readiness: *probes
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 15m
            memory: 64Mi
          limits:
            memory: 256Mi
defaultPodOptions:
  securityContext:
    runAsNonRoot: false
    runAsUser: 0
    runAsGroup: 0
persistence:
  config:
    type: persistentVolumeClaim
    storageClass: longhorn
    size: 128Mi
    accessMode: ReadWriteOnce
    globalMounts:
      - path: /app/data/state
service:
  app:
    ports:
      http:
        port: *port
route:
  app:
    parentRefs:
      - name: envoy-internal
        namespace: network
        sectionName: https
    rules:
      - backendRefs:
          - identifier: app
            port: *port
    annotations:
      gethomepage.dev/enabled: "true"
      gethomepage.dev/name: "Filestash"
      gethomepage.dev/group: "Storage"
      gethomepage.dev/description: "Browse SeaweedFS S3 buckets"
      gethomepage.dev/icon: "minio.png"
      gethomepage.dev/href: https://filestash.jgrecu.dev
    hostnames:
      - filestash.jgrecu.dev
