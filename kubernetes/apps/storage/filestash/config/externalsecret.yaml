---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: filestash-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: filestash-secret
    creationPolicy: Owner
  data:
    - secretKey: access-key-id
      remoteRef:
        key: s3manager
        property: access-key-id
    - secretKey: secret-access-key
      remoteRef:
        key: s3manager
        property: secret-access-key
