---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
  - ../../../../components/volsync
resources:
  - ./secret.sops.yaml
  - ./secret-r2.sops.yaml
patches:
  - target:
      kind: ReplicationSource
      name: volsync-local
    patch: |
      - op: replace
        path: /metadata/name
        value: health-auto-export-mongodb-backup
      - op: replace
        path: /metadata/namespace
        value: health
      - op: replace
        path: /spec/sourcePVC
        value: health-auto-export-mongodb
      - op: replace
        path: /spec/trigger/schedule
        value: "0 2 * * *"
      - op: replace
        path: /spec/restic/repository
        value: health-auto-export-mongodb-restic-secret
      - op: replace
        path: /spec/restic/cacheCapacity
        value: 1Gi
      - op: replace
        path: /spec/restic/retain/weekly
        value: 4
      - op: replace
        path: /spec/restic/retain/monthly
        value: 3
      - op: replace
        path: /spec/restic/moverResources/limits/memory
        value: 512Mi
      - op: replace
        path: /spec/restic/moverResources/requests/memory
        value: 256Mi
  - target:
      kind: ReplicationSource
      name: volsync-r2
    patch: |
      - op: replace
        path: /metadata/name
        value: health-auto-export-mongodb-backup-r2
      - op: replace
        path: /metadata/namespace
        value: health
      - op: replace
        path: /spec/sourcePVC
        value: health-auto-export-mongodb
      - op: replace
        path: /spec/restic/repository
        value: health-auto-export-mongodb-r2-restic-secret
