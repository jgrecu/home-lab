---
# Helm values for app-template (health-auto-export).
controllers:
  health-auto-export:
    strategy: Recreate
    pod:
      annotations:
        secret.reloader.stakater.com/reload: health-auto-export-secret
    containers:
      app:
        image:
          tag: "v0.2.1"
          repository: forgejo.jgrecu.dev/jeremy/health-auto-export
        env:
          NODE_ENV: production
          MONGO_HOST: health-auto-export-mongodb.health.svc.cluster.local
          MONGO_PORT: "27017"
          MONGO_DB: health-auto-export
          MONGO_USERNAME:
            valueFrom:
              secretKeyRef:
                name: health-auto-export-secret
                key: mongo-username
          MONGO_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: health-auto-export-secret
                key: mongo-password
          READ_TOKEN:
            valueFrom:
              secretKeyRef:
                name: health-auto-export-secret
                key: read-token
          WRITE_TOKEN:
            valueFrom:
              secretKeyRef:
                name: health-auto-export-secret
                key: write-token
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: &port 3001
              initialDelaySeconds: 10
              periodSeconds: 30
              failureThreshold: 3
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: *port
              initialDelaySeconds: 5
              periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          runAsUser: 65534
          runAsGroup: 65534
          runAsNonRoot: true
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
service:
  app:
    ports:
      http:
        port: *port
route:
  app:
    parentRefs:
      - name: envoy-internal
        namespace: network
        sectionName: https
    rules:
      - backendRefs:
          - identifier: app
            port: *port
    annotations:
      gethomepage.dev/enabled: "true"
      gethomepage.dev/group: Health
      gethomepage.dev/name: Health Auto Export
      gethomepage.dev/icon: apple-health.png
      gethomepage.dev/description: Apple Health data ingestion
      gethomepage.dev/href: https://hae.jgrecu.dev
    hostnames:
      - hae.jgrecu.dev
