---
# Helm values for tuppr (tuppr).
controller:
  logLevel: info

    # Enable Prometheus scraping — kube-prometheus-stack picks this up
    # automatically via serviceMonitorSelectorNilUsesHelmValues: false
serviceMonitor:
  enabled: true

resources:
  requests:
    cpu: 15m
    memory: 128Mi
  limits:
    memory: 256Mi
