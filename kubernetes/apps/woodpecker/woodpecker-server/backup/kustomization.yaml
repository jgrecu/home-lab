---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
  - ../../../../components/volsync
resources:
  - ./secret.sops.yaml
  - ./secret-r2.sops.yaml
patches:
  - target:
      kind: ReplicationSource
      name: volsync-local
    patch: |
      - op: replace
        path: /metadata/name
        value: woodpecker-server-data-backup
      - op: replace
        path: /metadata/namespace
        value: woodpecker
      - op: replace
        path: /spec/sourcePVC
        value: woodpecker-server
      - op: replace
        path: /spec/trigger/schedule
        value: "0 3 * * *"
      - op: replace
        path: /spec/restic/repository
        value: woodpecker-server-data-restic-secret
      - op: replace
        path: /spec/restic/cacheCapacity
        value: 2Gi
      - op: replace
        path: /spec/restic/moverResources/limits/memory
        value: 1Gi
      - op: replace
        path: /spec/restic/moverResources/requests/cpu
        value: 100m
      - op: replace
        path: /spec/restic/moverResources/requests/memory
        value: 512Mi
  - target:
      kind: ReplicationSource
      name: volsync-r2
    patch: |
      - op: replace
        path: /metadata/name
        value: woodpecker-server-data-backup-r2
      - op: replace
        path: /metadata/namespace
        value: woodpecker
      - op: replace
        path: /spec/sourcePVC
        value: woodpecker-server
      - op: replace
        path: /spec/restic/repository
        value: woodpecker-server-data-r2-restic-secret
