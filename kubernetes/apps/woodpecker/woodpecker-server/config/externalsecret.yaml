---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: woodpecker-server-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: woodpecker-server-secret
    creationPolicy: Owner
  data:
    - secretKey: gitea-client-id
      remoteRef:
        key: woodpecker
        property: gitea-client-id
    - secretKey: gitea-client-secret
      remoteRef:
        key: woodpecker
        property: gitea-client-secret
    - secretKey: agent-secret
      remoteRef:
        key: woodpecker
        property: agent-secret
