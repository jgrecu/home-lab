---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: woodpecker-agent-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: woodpecker-agent-secret
    creationPolicy: Owner
  data:
    - secretKey: agent-secret
      remoteRef:
        key: woodpecker-agent
        property: agent-secret
