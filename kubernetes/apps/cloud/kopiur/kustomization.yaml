---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cloud
components:
  - ../../../components/kopiur/namespace
patches:
  - target:
      kind: Repository
      name: kopiur-primary
    patch: |
      - op: replace
        path: /spec/backend/s3/prefix
        value: cloud/
