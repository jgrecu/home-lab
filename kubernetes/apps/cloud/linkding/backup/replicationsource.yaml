---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: linkding-data-backup
  namespace: cloud
spec:
  sourcePVC: linkding
  trigger:
    schedule: "0 2 * * *"  # Daily at 2 AM
  restic:
    repository: linkding-restic-secret
    retain:
      daily: 7      # Last week
      weekly: 4     # Last month
      monthly: 3    # Last 3 months
    copyMethod: Snapshot
    storageClassName: longhorn-volsync
    volumeSnapshotClassName: longhorn
    capacity: 2Gi
    accessModes:
      - ReadWriteOnce
    pruneIntervalDays: 7
    cacheCapacity: 1Gi
    cacheStorageClassName: longhorn-single
    cacheAccessModes:
      - ReadWriteOnce
    moverResources:
      limits:
        memory: 512Mi
      requests:
        cpu: 50m
        memory: 256Mi
    moverSecurityContext:
      runAsNonRoot: true
      runAsUser: 65534
      fsGroup: 65534
      seccompProfile:
        type: RuntimeDefault
