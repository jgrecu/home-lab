---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: memos-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: memos-secret
    creationPolicy: Owner
  data:
    - secretKey: admin-password
      remoteRef:
        key: memos
        property: admin-password
    - secretKey: oidc-client-secret
      remoteRef:
        key: memos
        property: oidc-client-secret
