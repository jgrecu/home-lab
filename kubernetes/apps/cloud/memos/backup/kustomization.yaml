---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
  - ../../../../components/volsync
patches:
  - target:
      kind: ReplicationSource
      name: volsync-local
    patch: |
      - op: replace
        path: /metadata/name
        value: memos-data-backup
      - op: replace
        path: /metadata/namespace
        value: cloud
      - op: replace
        path: /spec/sourcePVC
        value: memos
      - op: replace
        path: /spec/trigger/schedule
        value: "0 3 * * *"
      - op: replace
        path: /spec/restic/repository
        value: memos-data-restic-secret
      - op: replace
        path: /spec/restic/cacheCapacity
        value: 1Gi
      - op: replace
        path: /spec/restic/retain/weekly
        value: 4
      - op: replace
        path: /spec/restic/retain/monthly
        value: 3
      - op: replace
        path: /spec/restic/moverResources/limits/memory
        value: 256Mi
      - op: replace
        path: /spec/restic/moverResources/requests/memory
        value: 128Mi
  - target:
      kind: ReplicationSource
      name: volsync-r2
    patch: |
      - op: replace
        path: /metadata/name
        value: memos-data-backup-r2
      - op: replace
        path: /metadata/namespace
        value: cloud
      - op: replace
        path: /spec/sourcePVC
        value: memos
      - op: replace
        path: /spec/restic/repository
        value: memos-data-r2-restic-secret
resources:
  - ./externalsecret.yaml
  - ./externalsecret-r2.yaml
