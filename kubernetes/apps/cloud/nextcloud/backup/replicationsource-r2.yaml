---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: nextcloud-html-backup-r2
spec:
  sourcePVC: nextcloud
  trigger:
    schedule: "0 12 * * *"  # Daily at noon (offsite R2 backup)
  restic:
    repository: nextcloud-html-r2-restic-secret
    retain:
      daily: 7
      weekly: 4
      monthly: 12
    copyMethod: Snapshot
    storageClassName: longhorn-volsync
    volumeSnapshotClassName: longhorn
    capacity: 10Gi
    accessModes:
      - ReadWriteOnce
    pruneIntervalDays: 14
    cacheCapacity: 2Gi
    cacheStorageClassName: longhorn-single
    cacheAccessModes:
      - ReadWriteOnce
    moverResources:
      limits:
        memory: 1Gi
      requests:
        cpu: 50m
        memory: 512Mi
    moverSecurityContext:
      runAsNonRoot: true
      runAsUser: 65534
      fsGroup: 65534
      seccompProfile:
        type: RuntimeDefault
