---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nextcloud-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: nextcloud-secret
    creationPolicy: Owner
  data:
    - secretKey: admin-password
      remoteRef:
        key: nextcloud
        property: admin-password
