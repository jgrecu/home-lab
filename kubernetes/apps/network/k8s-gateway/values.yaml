---
# Helm values for k8s-gateway (k8s-gateway).
fullnameOverride: k8s-gateway
ttl: 1
resources:
  requests:
    cpu: 15m
    memory: 100Mi
  limits:
    memory: 256Mi
service:
  type: LoadBalancer
  port: 53
  annotations:
    lbipam.cilium.io/ips: "192.168.1.159"
  externalTrafficPolicy: Cluster
watchedResources: ["HTTPRoute", "Service"]

# --- merged from values.sops.yaml ---
# Helm values with the domain (fully encrypted) for k8s-gateway (k8s-gateway).
domain: jgrecu.dev
