---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: wg-portal-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: wg-portal-secret
    creationPolicy: Owner
  data:
    - secretKey: admin-password
      remoteRef:
        key: wg-portal
        property: admin-password
    - secretKey: server-private-key
      remoteRef:
        key: wg-portal
        property: server-private-key
