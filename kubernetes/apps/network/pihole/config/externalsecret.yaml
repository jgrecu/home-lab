---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pihole-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: pihole-secret
    creationPolicy: Owner
  data:
    - secretKey: admin-password
      remoteRef:
        key: pihole
        property: admin-password
