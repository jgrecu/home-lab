apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: jgrecu-dev-production
spec:
  dnsNames:
    - jgrecu.dev
    - '*.jgrecu.dev'
  duration: 160h
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  privateKey:
    algorithm: ECDSA
  secretName: jgrecu-dev-production-tls
  usages:
    - digital signature
