---
# Argo CD (argo-helm/argo-cd). Self-managed via kubernetes/argo/apps/argo-system/argo-cd.yaml.
# Domain-bearing settings (HTTPRoutes, webhook secret) live in values.sops.yaml (fully encrypted).
fullnameOverride: argocd

global:
  domain: argo.jgrecu.dev

crds:
  install: true
  keep: true # never delete Applications by uninstalling the chart

configs:
  params:
    server.insecure: true # TLS terminates at envoy gateway
    controller.diff.server.side: true
  cm:
    statusbadge.enabled: true
    exec.enabled: false
    admin.enabled: true
    timeout.reconciliation: 180s
    oidc.config: |
      name: Pocket ID
      issuer: https://id.jgrecu.dev
      clientID: $oidc.pocket-id.clientID
      clientSecret: $oidc.pocket-id.clientSecret
      requestedScopes:
        - openid
        - profile
        - email
        - groups
      groupsClaim: groups
    # ksops = kustomize exec plugin; --enable-helm only for the few kustomize helmCharts apps
    # --helm-command: kustomize runs helm with a minimal env (no HELM_PLUGINS), bypass the helm-secrets wrapper
    # --load-restrictor: same as Flux (e.g. volsync/config references ../namespace.yaml)
    url: https://argo.jgrecu.dev
    kustomize.buildOptions: "--enable-alpha-plugins --enable-exec --enable-helm --helm-command /usr/local/bin/helm --load-restrictor LoadRestrictionsNone"
    helm.valuesFileSchemes: >-
      secrets+age-import, secrets+age-import-kubernetes,
      secrets, secrets+literal, https
    resource.exclusions: |
      - apiGroups: ["cilium.io"]
        kinds: ["CiliumIdentity"]
        clusters: ["*"]
    # Argo CD 3.x no longer assesses child Application health; restore it so
    # app-of-apps sync waves wait for each wave to be Healthy (Flux dependsOn).
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil and obj.status.health ~= nil then
        hs.status = obj.status.health.status
        if obj.status.health.message ~= nil then
          hs.message = obj.status.health.message
        end
      end
      return hs
    # PVCs restored by volsync get dataSourceRef set once at creation; ignore it everywhere
    resource.customizations.ignoreDifferences.PersistentVolumeClaim: |
      jsonPointers:
        - /spec/dataSource
        - /spec/dataSourceRef
  rbac:
    policy.default: role:readonly
    policy.csv: |
      g, admins, role:admin

controller:
  replicas: 1
  metrics:
    enabled: true
    applicationLabels:
      enabled: true
    serviceMonitor:
      enabled: true

# No SSO configured: local admin only (dex not needed)
dex:
  enabled: false

redis:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

server:
  replicas: 1
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  # UI/API: LAN only
  httproute:
    enabled: true
    parentRefs:
      - name: envoy-internal
        namespace: network
        sectionName: https
    annotations:
      gethomepage.dev/enabled: "true"
      gethomepage.dev/group: Infrastructure
      gethomepage.dev/name: Argo CD
      gethomepage.dev/icon: argo-cd.png
      gethomepage.dev/description: GitOps continuous delivery
      gethomepage.dev/href: https://argo.jgrecu.dev
    hostnames:
      - argo.jgrecu.dev

applicationSet:
  replicas: 1
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

notifications:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

repoServer:
  replicas: 2
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  env:
    # helm-secrets (Helm 4 support since v4.7.0): wrapper decrypts *.sops.yaml value files
    - name: HELM_PLUGINS
      value: /custom-tools/helm-plugins/
    - name: HELM_SECRETS_SOPS_PATH
      value: /custom-tools/sops
    - name: HELM_SECRETS_BACKEND
      value: sops
    - name: HELM_SECRETS_WRAPPER_ENABLED
      value: "true"
    - name: HELM_SECRETS_HELM_PATH
      value: /usr/local/bin/helm
    - name: HELM_SECRETS_DECRYPT_SECRETS_IN_TMP_DIR
      value: "true"
    # https://github.com/jkroepke/helm-secrets/wiki/Security-in-shared-environments
    - name: HELM_SECRETS_VALUES_ALLOW_SYMLINKS
      value: "false"
    - name: HELM_SECRETS_VALUES_ALLOW_ABSOLUTE_PATH
      value: "true"
    - name: HELM_SECRETS_VALUES_ALLOW_PATH_TRAVERSAL
      value: "false"
    # age key used by both helm-secrets (sops) and ksops
    - name: SOPS_AGE_KEY_FILE
      value: /sops-age/age.agekey
  volumes:
    - name: custom-tools
      emptyDir: {}
    - name: sops-age
      secret:
        secretName: sops-age # created by bootstrap (scripts/bootstrap-apps.sh)
  volumeMounts:
    - name: custom-tools
      mountPath: /custom-tools
    - name: custom-tools
      mountPath: /usr/local/sbin/helm # wrapper shadows /usr/local/bin/helm on PATH
      subPath: helm
    - name: custom-tools
      mountPath: /usr/local/bin/ksops
      subPath: ksops
    - name: sops-age
      mountPath: /sops-age
      readOnly: true
  initContainers:
    # Official release binaries only, pinned and checksum-verified.
    - name: download-tools
      image: docker.io/library/alpine:3.24.4
      command: [sh, -euc]
      env:
        - name: SOPS_VERSION
          # renovate: datasource=github-releases depName=getsops/sops
          value: 3.13.3
        - name: KSOPS_VERSION
          # renovate: datasource=github-releases depName=viaduct-ai/kustomize-sops
          value: 4.5.1
        - name: HELM_SECRETS_VERSION
          # renovate: datasource=github-releases depName=jkroepke/helm-secrets
          value: 4.7.10
      args:
        - |
          ARCH=$(uname -m | sed -e 's/x86_64/amd64/' -e 's/aarch64/arm64/')
          KARCH=$(uname -m | sed -e 's/aarch64/arm64/')
          GH=https://github.com
          cd /tmp
          wget -q "$GH/getsops/sops/releases/download/v$SOPS_VERSION/sops-v$SOPS_VERSION.linux.$ARCH"
          wget -q "$GH/getsops/sops/releases/download/v$SOPS_VERSION/sops-v$SOPS_VERSION.checksums.txt"
          grep " sops-v$SOPS_VERSION.linux.$ARCH\$" "sops-v$SOPS_VERSION.checksums.txt" | sha256sum -c -
          install -m 0755 "sops-v$SOPS_VERSION.linux.$ARCH" /custom-tools/sops
          wget -q "$GH/viaduct-ai/kustomize-sops/releases/download/v$KSOPS_VERSION/ksops_${KSOPS_VERSION}_Linux_$KARCH.tar.gz"
          wget -q -O ksops-checksums.txt "$GH/viaduct-ai/kustomize-sops/releases/download/v$KSOPS_VERSION/checksums.txt"
          grep " ksops_${KSOPS_VERSION}_Linux_$KARCH.tar.gz\$" ksops-checksums.txt | sha256sum -c -
          tar -xzf "ksops_${KSOPS_VERSION}_Linux_$KARCH.tar.gz" ksops
          install -m 0755 ksops /custom-tools/ksops
          mkdir -p /custom-tools/helm-plugins
          for p in secrets secrets-getter secrets-post-renderer; do
            wget -qO- "$GH/jkroepke/helm-secrets/releases/download/v$HELM_SECRETS_VERSION/$p-$HELM_SECRETS_VERSION.tgz" \
              | tar -C /custom-tools/helm-plugins -xzf -
          done
          install -m 0755 /custom-tools/helm-plugins/secrets/scripts/wrapper/helm.sh /custom-tools/helm
          ls -la /custom-tools
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
      volumeMounts:
        - name: custom-tools
          mountPath: /custom-tools
        - name: tmp
          mountPath: /tmp

extraObjects:
  - apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata:
      name: argocd-oidc-secret
      namespace: argo-system
    spec:
      refreshInterval: 1h
      secretStoreRef:
        name: vault
        kind: ClusterSecretStore
      target:
        name: argocd-secret
        creationPolicy: Merge
      data:
        - secretKey: oidc.pocket-id.clientID
          remoteRef:
            key: argocd
            property: oidc-client-id
        - secretKey: oidc.pocket-id.clientSecret
          remoteRef:
            key: argocd
            property: oidc-client-secret
  # GitHub push webhook: only /api/webhook published on external gateway
  - apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: argocd-webhook
      namespace: argo-system
    spec:
      parentRefs:
        - name: envoy-external
          namespace: network
          sectionName: https
      hostnames:
        - argo-webhook.jgrecu.dev
      rules:
        - matches:
            - path:
                type: Exact
                value: /api/webhook
          backendRefs:
            - name: argocd-server
              port: 80
