---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app forgejo-runner-native
spec:
  chartRef:
    kind: OCIRepository
    name: forgejo-runner-native
  interval: 1h
  timeout: 15m
  postRenderers:
    - kustomize:
        patches:
          - patch: |
              - op: replace
                path: /spec/template/spec/serviceAccountName
                value: forgejo-runner-native
            target:
              kind: Deployment
              name: forgejo-runner-native
  values:
    defaultPodOptions:
      automountServiceAccountToken: true
    controllers:
      forgejo-runner-native:
        replicas: 1
        strategy: Recreate
        pod:
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: "OnRootMismatch"
          annotations:
            secret.reloader.stakater.com/reload: *app
        # Clones infinoid's k8s-runner fork and builds a single binary.
        # Simpler than eleboucher's approach: no separate plugin binary,
        # the k8s backend is native to the runner binary itself.
        # Build takes ~3-4 min on first pod start; cached in emptyDir for restarts.
        initContainers:
          build-runner:
            image:
              repository: golang
              tag: 1.24-alpine
            command:
              - /bin/sh
              - -c
              - |
                set -e
                apk add --no-cache git

                git clone --depth 1 \
                  https://code.forgejo.org/infinoid/k8s-runner.git \
                  /tmp/runner-src

                cd /tmp/runner-src
                go build -o /runner/forgejo-runner .
                chmod 755 /runner/forgejo-runner
                echo "Build complete: $(/runner/forgejo-runner --version 2>&1 || true)"
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              # Root required for apk add
              runAsUser: 0
            resources:
              requests:
                cpu: 200m
                memory: 512Mi
              limits:
                memory: 1Gi
        containers:
          app:
            image:
              repository: alpine
              tag: "3.22"
            command: ["/bin/sh", "-c"]
            args:
              - |
                # Config uses container.kubernetes: true to enable the native k8s backend.
                # Labels use k8spod: scheme — the arg is the path to the podspec file
                # inside this pod (mounted from the forgejo-runner-native-podspecs ConfigMap).
                # cache.enabled: false — native k8s backend has no cache server support yet.
                cat > /data/config.yaml <<'EOF'
                log:
                  level: info
                runner:
                  capacity: 4
                  timeout: 3h
                  file: /data/.runner
                  labels:
                    - "ubuntu-latest:k8spod:/config/podspec-default.yaml"
                    - "ubuntu-22.04:k8spod:/config/podspec-default.yaml"
                container:
                  kubernetes: true
                  k8s_namespace: forgejo
                cache:
                  enabled: false
                EOF

                if [ ! -f /data/.runner ]; then
                  /runner/forgejo-runner register \
                    --no-interactive \
                    --config /data/config.yaml \
                    --instance "$FORGEJO_INSTANCE_URL" \
                    --token "$FORGEJO_RUNNER_REGISTRATION_TOKEN" \
                    --name "$HOSTNAME"
                fi
                /runner/forgejo-runner daemon --config /data/config.yaml
            env:
              FORGEJO_INSTANCE_URL: "http://forgejo-http.forgejo.svc.cluster.local:3000"
              FORGEJO_RUNNER_REGISTRATION_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: forgejo-runner-native-secret
                    key: registration-token
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              runAsUser: 1000
              runAsGroup: 1000
            resources:
              requests:
                cpu: 15m
                memory: 64Mi
              limits:
                memory: 128Mi
    persistence:
      # Persists runner registration state (.runner file) and generated config.yaml.
      data:
        type: persistentVolumeClaim
        storageClass: longhorn
        size: 1Gi
        accessMode: ReadWriteOnce
        globalMounts:
          - path: /data
      # Shared emptyDir for the binary built by the init container.
      runner:
        type: emptyDir
        globalMounts:
          - path: /runner
      # Pod spec YAML files for CI job pods, referenced by label args.
      podspec:
        type: configMap
        name: forgejo-runner-native-podspecs
        globalMounts:
          - path: /config
            readOnly: true
