---
# Note: sourcePVC is "gitea-shared-storage" — legacy Gitea PVC name kept after Forgejo migration.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
  - ../../../../components/volsync
resources:
  - ./secret.sops.yaml
  - ./secret-r2.sops.yaml
patches:
  - target:
      kind: ReplicationSource
      name: volsync-local
    patch: |
      - op: replace
        path: /metadata/name
        value: forgejo-data-backup
      - op: replace
        path: /metadata/namespace
        value: forgejo
      - op: replace
        path: /spec/sourcePVC
        value: gitea-shared-storage
      - op: replace
        path: /spec/trigger/schedule
        value: "0 3 * * *"
      - op: replace
        path: /spec/restic/repository
        value: forgejo-data-restic-secret
      - op: replace
        path: /spec/restic/capacity
        value: 20Gi
      - op: replace
        path: /spec/restic/cacheCapacity
        value: 4Gi
      - op: replace
        path: /spec/restic/moverResources/limits/memory
        value: 2Gi
      - op: replace
        path: /spec/restic/moverResources/requests/cpu
        value: 100m
      - op: replace
        path: /spec/restic/moverResources/requests/memory
        value: 1Gi
  - target:
      kind: ReplicationSource
      name: volsync-r2
    patch: |
      - op: replace
        path: /metadata/name
        value: forgejo-data-backup-r2
      - op: replace
        path: /metadata/namespace
        value: forgejo
      - op: replace
        path: /spec/sourcePVC
        value: gitea-shared-storage
      - op: replace
        path: /spec/restic/repository
        value: forgejo-data-r2-restic-secret
      - op: replace
        path: /spec/restic/capacity
        value: 20Gi
      - op: replace
        path: /spec/restic/cacheCapacity
        value: 4Gi
      - op: replace
        path: /spec/restic/moverResources/limits/memory
        value: 2Gi
      - op: replace
        path: /spec/restic/moverResources/requests/memory
        value: 1Gi
