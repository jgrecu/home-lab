---
# Note: sourcePVC is "gitea-shared-storage" — legacy Gitea PVC name kept after Forgejo migration.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: forgejo
components:
  - ../../../../components/kopiur/app
patches:
  - target:
      kind: SnapshotPolicy
      name: kopiur-app
    patch: |
      - op: replace
        path: /metadata/name
        value: forgejo
      - op: replace
        path: /spec/sources/0/pvc/name
        value: gitea-shared-storage
      - op: replace
        path: /spec/mover/resources/requests/memory
        value: 1Gi
      - op: replace
        path: /spec/mover/resources/limits/memory
        value: 2Gi
  - target:
      kind: SnapshotSchedule
      name: kopiur-app
    patch: |
      - op: replace
        path: /metadata/name
        value: forgejo
      - op: replace
        path: /spec/policyRef/name
        value: forgejo
      - op: replace
        path: /spec/schedule/cron
        value: "0 3 * * *"
