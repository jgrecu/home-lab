---
apiVersion: v1
kind: ConfigMap
metadata:
  name: forgejo-runner-podspecs
data:
  # Default PodSpec for CI job pods spawned by the K8s plugin.
  # Uses the bjw-s-labs Forgejo runner image: a purpose-built Ubuntu image with
  # Node.js, git, and common CI tools pre-installed and correctly on PATH.
  # Required for JavaScript actions (e.g. actions/checkout) to resolve `node`.
  podspec-default.yaml: |
    containers:
      - name: main
        image: ghcr.io/bjw-s-labs/forgejo-runner:ubuntu-24.04
        imagePullPolicy: IfNotPresent
        env:
          - name: DEBIAN_FRONTEND
            value: noninteractive
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi

  # PodSpec for Docker image builds via Kaniko.
  # Kaniko builds OCI images without a Docker daemon or privileged containers
  # (compliant with baseline PSS). The debug image includes a busybox shell
  # so the runner plugin can exec steps. Kaniko clones the repo directly from
  # the git context, so no checkout action is needed in kaniko jobs.
  podspec-kaniko.yaml: |
    containers:
      - name: main
        image: gcr.io/kaniko-project/executor:debug
        imagePullPolicy: IfNotPresent
        # Kaniko requires root to manipulate overlay filesystems.
        # runAsUser: 0 is allowed under baseline PSS (only privileged: true is blocked).
        securityContext:
          runAsUser: 0
          runAsGroup: 0
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            memory: 2Gi
