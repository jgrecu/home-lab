---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-runner-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: forgejo-runner-secret
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: forgejo-runner
        property: token
    - secretKey: uuid
      remoteRef:
        key: forgejo-runner
        property: uuid
