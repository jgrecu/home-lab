---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: forgejo-runner
  namespace: argo-system
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: kubernetes
  source:
    repoURL: "https://github.com/jgrecu/home-lab.git"
    targetRevision: "main"
    path: kubernetes/apps/forgejo/forgejo-runner
  destination:
    name: in-cluster
    namespace: forgejo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
      - PruneLast=true
      - RespectIgnoreDifferences=true
