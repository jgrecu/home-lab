---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: forgejo-runner
  namespace: argo-system
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: kubernetes
  sources:
    - repoURL: "https://github.com/jgrecu/home-lab.git"
      targetRevision: "main"
      path: kubernetes/apps/forgejo/forgejo-runner
      ref: repo
    - repoURL: git.erwanleboucher.dev/eleboucher/charts
      chart: forgejo-runner
      # renovate: datasource=docker depName=git.erwanleboucher.dev/eleboucher/charts/forgejo-runner
      targetRevision: 13.2.1
      helm:
        releaseName: forgejo-runner
        valueFiles:
          - $repo/kubernetes/apps/forgejo/forgejo-runner/values.yaml
  destination:
    name: in-cluster
    namespace: forgejo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
      - PruneLast=true
      - RespectIgnoreDifferences=true
