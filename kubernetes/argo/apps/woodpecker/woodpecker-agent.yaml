---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: woodpecker-agent
  namespace: argo-system
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: kubernetes
  sources:
    - repoURL: "https://github.com/jgrecu/home-lab.git"
      targetRevision: "main"
      ref: repo
    - repoURL: ghcr.io/bjw-s-labs/helm
      chart: app-template
      targetRevision: 5.3.0
      helm:
        releaseName: woodpecker-agent
        valueFiles:
          - $repo/kubernetes/apps/woodpecker/woodpecker-agent/values.yaml
    - repoURL: "https://github.com/jgrecu/home-lab.git"
      targetRevision: "main"
      path: kubernetes/apps/woodpecker/woodpecker-agent
  destination:
    name: in-cluster
    namespace: woodpecker
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
      - PruneLast=true
      - RespectIgnoreDifferences=true
