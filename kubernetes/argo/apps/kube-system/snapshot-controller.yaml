---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: snapshot-controller
  namespace: argo-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: kubernetes
  sources:
    - repoURL: "https://github.com/jgrecu/home-lab.git"
      targetRevision: "main"
      ref: repo
    - repoURL: https://piraeus.io/helm-charts
      chart: snapshot-controller
      targetRevision: 5.4.0
      helm:
        releaseName: snapshot-controller
        valueFiles:
          - $repo/kubernetes/apps/kube-system/snapshot-controller/values.yaml
    - repoURL: "https://github.com/jgrecu/home-lab.git"
      targetRevision: "main"
      path: kubernetes/apps/kube-system/snapshot-controller
  destination:
    name: in-cluster
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
      - PruneLast=true
      - RespectIgnoreDifferences=true
