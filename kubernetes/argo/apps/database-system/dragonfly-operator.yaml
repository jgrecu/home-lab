---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dragonfly-operator
  namespace: argo-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: kubernetes
  sources:
    - repoURL: "https://github.com/jgrecu/home-lab.git"
      targetRevision: "main"
      path: kubernetes/apps/database-system/dragonfly
      ref: repo
    - repoURL: ghcr.io/dragonflydb/dragonfly-operator/helm
      chart: dragonfly-operator
      targetRevision: v1.8.0
      helm:
        releaseName: dragonfly-operator
        valueFiles:
          - $repo/kubernetes/apps/database-system/dragonfly/values.yaml
  destination:
    name: in-cluster
    namespace: database-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
      - PruneLast=true
      - RespectIgnoreDifferences=true
