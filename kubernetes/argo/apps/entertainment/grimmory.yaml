---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grimmory
  namespace: argo-system
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: kubernetes
  sources:
    - repoURL: "https://github.com/jgrecu/home-lab.git"
      targetRevision: "main"
      path: kubernetes/apps/entertainment/grimmory
      ref: repo
    - repoURL: ghcr.io/grimmory-tools/helm-charts
      chart: grimmory
      # renovate: datasource=docker depName=ghcr.io/grimmory-tools/helm-charts/grimmory
      targetRevision: 3.5.0
      helm:
        releaseName: grimmory
        valueFiles:
          - $repo/kubernetes/apps/entertainment/grimmory/values.yaml
  destination:
    name: in-cluster
    namespace: entertainment
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
      - PruneLast=true
      - RespectIgnoreDifferences=true
