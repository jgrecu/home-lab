---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pocket-id
  namespace: argo-system
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: kubernetes
  sources:
    - repoURL: "https://github.com/jgrecu/home-lab.git"
      targetRevision: "main"
      ref: repo
    - repoURL: https://anza-labs.github.io/charts
      chart: pocket-id
      targetRevision: 2.3.0
      helm:
        releaseName: pocket-id
        valueFiles:
          - $repo/kubernetes/apps/auth/pocket-id/values.yaml
    - repoURL: "https://github.com/jgrecu/home-lab.git"
      targetRevision: "main"
      path: kubernetes/apps/auth/pocket-id
  destination:
    name: in-cluster
    namespace: auth
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
      - PruneLast=true
      - RespectIgnoreDifferences=true
