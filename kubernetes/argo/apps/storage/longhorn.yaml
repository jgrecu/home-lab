---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argo-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: kubernetes
  sources:
    - repoURL: "https://github.com/jgrecu/home-lab.git"
      targetRevision: "main"
      ref: repo
    - repoURL: https://charts.longhorn.io
      chart: longhorn
      targetRevision: 1.13.0
      helm:
        releaseName: longhorn
        valueFiles:
          - $repo/kubernetes/apps/storage/longhorn/values.yaml
    - repoURL: "https://github.com/jgrecu/home-lab.git"
      targetRevision: "main"
      path: kubernetes/apps/storage/longhorn
  destination:
    name: in-cluster
    namespace: storage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
      - PruneLast=true
      - RespectIgnoreDifferences=true
