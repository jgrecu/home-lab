---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: k8s-gateway
  namespace: argo-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: kubernetes
  sources:
    - repoURL: "https://github.com/jgrecu/home-lab.git"
      targetRevision: "main"
      path: kubernetes/apps/network/k8s-gateway
      ref: repo
    - repoURL: ghcr.io/k8s-gateway/charts
      chart: k8s-gateway
      targetRevision: 3.7.2
      helm:
        releaseName: k8s-gateway
        valueFiles:
          - $repo/kubernetes/apps/network/k8s-gateway/values.yaml
          - $repo/kubernetes/apps/network/k8s-gateway/values.sops.yaml
  destination:
    name: in-cluster
    namespace: network
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
      - PruneLast=true
      - RespectIgnoreDifferences=true
