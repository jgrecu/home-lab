---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: namespaces
  namespace: argo-system
  annotations:
    argocd.argoproj.io/sync-wave: "-8"
spec:
  project: kubernetes
  source:
    repoURL: "https://github.com/jgrecu/home-lab.git"
    targetRevision: "main"
    path: kubernetes/apps
  destination:
    name: in-cluster
    namespace: argo-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
      - PruneLast=true
