---
# Single project for all cluster apps (one cluster, one operator).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: kubernetes
  namespace: argo-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  description: home-lab cluster applications
  sourceRepos:
    - "*"
  destinations:
    - name: in-cluster
      namespace: "*"
      server: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
