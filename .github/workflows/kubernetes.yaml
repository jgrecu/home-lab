---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# Renders every Argo CD Application exactly like the repo-server (helm-secrets wrapper,
# kustomize + ksops) and validates the output with kubeconform.
#
# No SOPS decryption needed: all secrets are either plain YAML (domain config)
# or Vault-backed ExternalSecrets. Only vault-kms.sops.yaml remains encrypted
# and the vault app is excluded from the render check.
name: "Kubernetes"

on:
  pull_request:
    branches: ["main"]
    paths:
      - kubernetes/**
      - scripts/argo-parity.sh
      - scripts/render-flux-baseline.sh
      - .github/tests/**
      - .github/workflows/kubernetes.yaml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  render:
    name: Render & validate Argo CD apps
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        with:
          cache: false

      - name: Generate throwaway age key (for vault-kms.sops.yaml)
        run: age-keygen -o age.key

      - name: Render and validate every Application
        run: ./scripts/argo-parity.sh --render-only --skip-app vault
