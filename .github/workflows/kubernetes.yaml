---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# Renders every Argo CD Application exactly like the repo-server (helm-secrets wrapper,
# kustomize + ksops) and validates the output with kubeconform. Replaces flux-local/flate.
#
# No real secrets: the tree is re-rendered from templates/ with the fake test config
# (.github/tests/public.toml) and a throwaway age key generated by `just init`.
# Decryption of the real encrypted files is checked locally (just configure, sops-check hook).
name: "Kubernetes"

on:
  pull_request:
    branches: ["main"]
    paths:
      - kubernetes/**
      - templates/**
      - scripts/argo-parity.sh
      - scripts/render-flux-baseline.sh
      - .github/tests/**
      - .github/workflows/kubernetes.yaml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  render:
    name: Render & validate Argo CD apps
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        with:
          cache: false

      # Throwaway age key, deploy key and push token (never the real ones)
      - name: Run init
        run: just init

      - name: Prepare fake config
        run: |
          cp ./.github/tests/public.toml cluster.toml
          echo '{"AccountTag":"fake","TunnelSecret":"fake","TunnelID":"fake"}' > cloudflare-tunnel.json
          touch kubeconfig

      - name: Prepare Talos test secrets
        run: |
          umask 077
          talosctl gen secrets -o "$RUNNER_TEMP/talos-secrets.yaml"
          yq '.secretsPath = strenv(RUNNER_TEMP) + "/talos-secrets.yaml"' talos/topf.yaml > talos/topf-ci.yaml

      # Re-renders kubernetes/ from templates with fake values and re-encrypts every
      # *.sops.* file with the throwaway key; includes kustomize+ksops + kubeconform
      - name: Render templates (fake values)
        env:
          TOPFCONFIG: topf-ci.yaml
        run: |
          find kubernetes bootstrap -name '*.sops.*' -delete
          just --yes configure

      - name: Render and validate every Application
        run: ./scripts/argo-parity.sh --render-only
