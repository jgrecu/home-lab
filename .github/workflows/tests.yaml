---
name: Tests

on:
  push:
    branches: [main]
    paths:
      - "templates/scripts/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/tests.yaml"
      - ".mise.toml"
  pull_request:
    paths:
      - "templates/scripts/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/tests.yaml"
      - ".mise.toml"

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Run pytest
        run: uv run --with pytest --with makejinja pytest tests/

  shell:
    name: Shell tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Run bats tests
        run: bats tests/
