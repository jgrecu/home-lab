---
name: Tests

on:
  push:
    branches: [main]
    paths:
      - "templates/scripts/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/tests.yaml"
      - ".mise/config.toml"
  pull_request:
    paths:
      - "templates/scripts/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/tests.yaml"
      - ".mise/config.toml"

permissions: {}

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6

      - name: Run pytest
        run: uv run pytest tests/

  shell:
    name: Shell tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6

      - name: Run bats tests
        run: bats tests/
