---
name: Tests

on:
  push:
    branches: [main]
    paths:
      - "templates/scripts/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/tests.yaml"
      - ".mise/config.toml"
  pull_request:
    paths:
      - "templates/scripts/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/tests.yaml"
      - ".mise/config.toml"

permissions: {}

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7

      - name: Run pytest
        run: uv run pytest tests/

  shell:
    name: Shell tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7

      - name: Run bats tests
        run: bats tests/
