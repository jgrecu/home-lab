---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-fitness-heart
  namespace: observability
  labels:
    grafana_dashboard: "1"
    grafana_folder: "Fitness"
data:
  fitness-heart-health.json: |-
    {
      "title": "Fitness - Heart Health",
      "uid": "fitness-heart-health",
      "timezone": "browser",
      "refresh": "1h",
      "time": {"from": "now-90d", "to": "now"},
      "panels": [
        {
          "title": "Heart Rate (Daily Min / Avg / Max)",
          "type": "timeseries",
          "gridPos": {"h": 10, "w": 24, "x": 0, "y": 0},
          "datasource": {"type": "influxdb", "uid": "InfluxDB-Fitness"},
          "targets": [
            {
              "query": "from(bucket: \"health_metrics\")\n  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)\n  |> filter(fn: (r) => r._measurement == \"apple_health\" and r.metric == \"heart_rate\")\n  |> aggregateWindow(every: 1d, fn: min, createEmpty: false)\n  |> yield(name: \"min\")",
              "refId": "A"
            },
            {
              "query": "from(bucket: \"health_metrics\")\n  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)\n  |> filter(fn: (r) => r._measurement == \"apple_health\" and r.metric == \"heart_rate\")\n  |> aggregateWindow(every: 1d, fn: mean, createEmpty: false)\n  |> yield(name: \"avg\")",
              "refId": "B"
            },
            {
              "query": "from(bucket: \"health_metrics\")\n  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)\n  |> filter(fn: (r) => r._measurement == \"apple_health\" and r.metric == \"heart_rate\")\n  |> aggregateWindow(every: 1d, fn: max, createEmpty: false)\n  |> yield(name: \"max\")",
              "refId": "C"
            }
          ],
          "fieldConfig": {"defaults": {"unit": "bpm", "color": {"mode": "palette-classic"}}}
        },
        {
          "title": "Resting Heart Rate Trend (7-day moving average)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 10},
          "datasource": {"type": "influxdb", "uid": "InfluxDB-Fitness"},
          "targets": [{
            "query": "from(bucket: \"health_metrics\")\n  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)\n  |> filter(fn: (r) => r._measurement == \"apple_health\" and r.metric == \"heart_rate\")\n  |> aggregateWindow(every: 1d, fn: min, createEmpty: false)\n  |> movingAverage(n: 7)\n  |> yield(name: \"resting_hr_7d\")",
            "refId": "A"
          }],
          "fieldConfig": {"defaults": {"unit": "bpm", "color": {"fixedColor": "red", "mode": "fixed"}}}
        },
        {
          "title": "SpO2 Trend",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 10},
          "datasource": {"type": "influxdb", "uid": "InfluxDB-Fitness"},
          "targets": [{
            "query": "from(bucket: \"health_metrics\")\n  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)\n  |> filter(fn: (r) => r._measurement == \"apple_health\" and r.metric == \"oxygen_saturation\")\n  |> aggregateWindow(every: 1d, fn: mean, createEmpty: false)\n  |> map(fn: (r) => ({r with _value: r._value * 100.0}))\n  |> yield(name: \"spo2\")",
            "refId": "A"
          }],
          "fieldConfig": {"defaults": {"unit": "percent", "min": 90, "max": 100, "color": {"fixedColor": "purple", "mode": "fixed"}}}
        },
        {
          "title": "Respiratory Rate",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 18},
          "datasource": {"type": "influxdb", "uid": "InfluxDB-Fitness"},
          "targets": [{
            "query": "from(bucket: \"health_metrics\")\n  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)\n  |> filter(fn: (r) => r._measurement == \"apple_health\" and r.metric == \"respiratory_rate\")\n  |> aggregateWindow(every: 1d, fn: mean, createEmpty: false)\n  |> yield(name: \"resp_rate\")",
            "refId": "A"
          }],
          "fieldConfig": {"defaults": {"unit": "breathspm", "color": {"fixedColor": "cyan", "mode": "fixed"}}}
        },
        {
          "title": "Blood Pressure",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 18},
          "datasource": {"type": "influxdb", "uid": "InfluxDB-Fitness"},
          "targets": [
            {
              "query": "from(bucket: \"health_metrics\")\n  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)\n  |> filter(fn: (r) => r._measurement == \"apple_health\" and r.metric == \"blood_pressure_systolic\")\n  |> aggregateWindow(every: 1d, fn: last, createEmpty: false)\n  |> yield(name: \"systolic\")",
              "refId": "A"
            },
            {
              "query": "from(bucket: \"health_metrics\")\n  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)\n  |> filter(fn: (r) => r._measurement == \"apple_health\" and r.metric == \"blood_pressure_diastolic\")\n  |> aggregateWindow(every: 1d, fn: last, createEmpty: false)\n  |> yield(name: \"diastolic\")",
              "refId": "B"
            }
          ],
          "fieldConfig": {"defaults": {"unit": "mmHg", "color": {"mode": "palette-classic"}}}
        }
      ],
      "schemaVersion": 39
    }
