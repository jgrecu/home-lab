---
# Raft snapshot every 6h -> R2 (<bucket>/vault-snapshots/), 30 day retention.
# Vault side (one-time): `just ops vault-snapshot-setup` (kubernetes auth role
# "raft-snapshot" bound to this ServiceAccount, read-only on the snapshot path).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-snapshot
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vault-raft-snapshot
spec:
  schedule: "15 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          serviceAccountName: vault-snapshot
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: snapshot
              image: hashicorp/vault:2.2.2
              env:
                - name: VAULT_ADDR
                  value: http://vault-active.vault.svc:8200
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  JWT=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
                  VAULT_TOKEN=$(vault write -field=token auth/kubernetes/login role=raft-snapshot jwt="$JWT")
                  export VAULT_TOKEN
                  FILE=/snapshots/vault-$(date -u +%Y%m%dT%H%M%SZ).snap
                  vault operator raft snapshot save "$FILE"
                  ls -la /snapshots
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: snapshots
                  mountPath: /snapshots
          containers:
            - name: upload
              image: rclone/rclone:1.76.0
              envFrom:
                - secretRef:
                    name: vault-snapshot-r2
              env:
                - name: HOME
                  value: /tmp
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  DEST="r2:$R2_BUCKET/vault-snapshots"
                  rclone copy /snapshots "$DEST" --s3-no-check-bucket -v
                  rclone delete "$DEST" --min-age 30d --include "vault-*.snap" -v
                  rclone lsl "$DEST" | tail -5
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: snapshots
                  mountPath: /snapshots
                  readOnly: true
          volumes:
            - name: snapshots
              emptyDir:
                sizeLimit: 512Mi
